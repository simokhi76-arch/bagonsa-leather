name: BAGONSA SEO Engine Build & GitHub Pages Deployment

on:
  push:
    branches:
      - main
  schedule:
    # Run once daily at 06:00 UTC for automated drip and freshness updates
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      trigger_indexing:
        description: 'Trigger Google Indexing API submission after build'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Seed Keywords
        run: |
          python -c "
          import csv
          with open('data/keywords_100.csv', encoding='utf-8') as f:
              rows = list(csv.DictReader(f))
          assert len(rows) == 100, f'Expected 100 keywords, found {len(rows)}'
          print(f'Keyword integrity verified: {len(rows)} rows.')
          "

      - name: Build Static HTML Pages & SEO Hub
        env:
          GITHUB_USER: ${{ github.repository_owner }}
          GITHUB_REPO: ${{ github.event.repository.name }}
          GITHUB_PAGES_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: |
          python src/build_html_pages.py

      - name: Build Colab Parasite Notebooks
        env:
          GITHUB_USER: ${{ github.repository_owner }}
          GITHUB_REPO: ${{ github.event.repository.name }}
        run: |
          python src/build_colab_notebooks.py

      - name: Commit & Push Colab Notebooks to Main (if modified)
        run: |
          git config user.name "BAGONSA GitHub Actions"
          git config user.email "actions@github.com"
          git add dist_colab/
          if git diff --staged --quiet; then
            echo "No changes in dist_colab/ to commit."
          else
            git commit -m "Automated build: update Google Colab parasite notebooks"
            git push origin main
          fi

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist_pages'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Google Indexing API Notification (Optional)
        if: ${{ (github.event.inputs.trigger_indexing == 'true' || github.event_name == 'schedule') && env.HAS_GCP_SECRET == 'true' }}
        env:
          HAS_GCP_SECRET: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY != '' }}
          GCP_KEY_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
        run: |
          echo "$GCP_KEY_JSON" > service_account.json
          python src/google_indexer.py --key-file service_account.json --delay 1.5
          rm -f service_account.json
